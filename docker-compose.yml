version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: campusflow-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: campusflow
      POSTGRES_PASSWORD: campusflow_password
      POSTGRES_DB: campusflow_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campusflow -d campusflow_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campusflow-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://campusflow:campusflow_password@db:5432/campusflow_db
      JWT_SECRET: super-secret-campusflow-agentic-jwt-key-2026
      LLM_PROVIDER: mock
      LLM_MODEL: gpt-4o-mini
      LLM_API_KEY: ""
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: campusflow-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:
